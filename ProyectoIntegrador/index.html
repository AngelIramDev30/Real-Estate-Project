<!DOCTYPE html>
<html lang="es-MX">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shark Estate</title>
    
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>
    <div class="background-container"></div>
    
    <header class="navbar">
        <div class="logo">
            <svg viewBox="0 0 100 100" width="50" height="50">
                <path d="M10 50 L50 20 L90 50 L90 90 L10 90 Z" fill="transparent" stroke="#a855f7" stroke-width="5"/>
                <path d="M50 80 Q 40 40 70 30 Q 60 70 50 80" fill="#a855f7" />
            </svg>
        </div>
        
        <nav class="nav-links">
            <a href="#" class="active">Inicio</a>
            <a href="#">Venta</a>
            <a href="#">Renta</a>
        </nav>
        
        <div class="user-profile">
            <button class="btn-login">Iniciar Sesión</button>
        </div>
    </header>

    <main>
        <section class="search-section">
            <div class="search-bar">
                <input type="text" placeholder="Tipo" class="search-input">
                <input type="text" placeholder="Localidad" class="search-input">
                <input type="text" placeholder="Precio min" class="search-input">
                <input type="text" placeholder="Precio max" class="search-input">
            </div>
        </section>

        <section class="featured-section">
            <h2>Destacados de San Carlos, Sonora</h2>
            <div class="cards-container" id="properties-container">
                <p style="color:white; padding: 20px;">Conectando con la API y cargando propiedades...</p>
            </div>
        </section>

        <section class="map-section">
            <h2>Ubicacion en Mapa</h2>
            <div id="map"></div>
        </section>
    </main>

    <div id="property-modal" class="modal-overlay">
        <div class="modal-content">
            <span class="close-btn" onclick="cerrarModal()">&times;</span>
            <div class="modal-slider">
                <button class="slider-btn prev-btn" onclick="cambiarImagen(-1)">&#10094;</button>
                <img id="modal-img" src="" alt="Foto">
                <button class="slider-btn next-btn" onclick="cambiarImagen(1)">&#10095;</button>
            </div>
            <div class="slider-dots" id="slider-dots"></div>
            <h3 id="modal-title">Titulo</h3>
            <p id="modal-price" class="price"></p>
            <p id="modal-location" class="location"></p>
            <p id="modal-description"></p>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="app.js"></script>
</body>
</html>
