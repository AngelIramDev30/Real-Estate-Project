<!DOCTYPE html>
<html lang="es-mx">
<head>
    <link rel="stylesheet" href="estilo.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="app.js" defer></script>
    <title>Formulario</title>
</head>
<body>
    <form method="post" id="formulario">
        <fieldset>
            <legend>Formulario de Registro</legend>
        <div class="campo">
        <label for="nombre_usuario">Nombre de Usuario</label>
        <input type="text" id="nombre_usuario" name="nombre_usuario" required>
        </div>
        <div class="campo">
            <label for="apellido_paterno">Apellido Paterno</label>
            <input type="text" id="apellido_paterno" name="apellido_paterno" required>
        </div>
        <div class="campo">
            <label for="apellido_materno">Apellido Materno</label>
            <input type="text" id="apellido_materno" name="apellido_materno" required>
        </div>
        <div class="campo">
            <label for="correo_electronico">Correo Electrónico</label>
            <input type="email" id="correo_electronico" name="correo_electronico" required>
        </div>
        <div class="campo">
            <label for="telefono">Telefono</label>  
            <input 
            maxlength="10"
            type="tel" 
            id="telefono" 
            name="telefono" 
            inputmode="numeric"
            oninput="this.value = this.value.replace(/[^0-9]/g, '')" 
            required>
        </div>
        <div class="campo">
            <label for="contrasena">Contraseña</label>
            <input type="password" id="contrasena" name="contrasena" required>
        </div>
        <div class="campo">
            <span>Pais</span>
            <label><input type="radio" name="pais" value="México" required> México</label>
            <label><input type="radio" name="pais" value="Estados Unidos"> Estados Unidos</label>
        </div>
        <div class="campo">
            <label for="idioma">Idioma</label>
            <select id="idioma" name="idioma" required>
                <option value="es">Español</option>
                <option value="en">Ingles</option>
            </select>
        </div>
        <div class="campo">
            <label for="comentarios">Comentarios</label>
            <textarea name="comentarios" id="comentarios" cols="30" rows="10" placeholder="Escribe tus comentarios"></textarea>
        </div>
        <button type="submit">Guardar</button>
        </fieldset>
    </form>
    <button id="toggle-btn">Modo Oscuro</button>
</body>
</html>
